<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="practice8.css" rel="stylesheet" />
</head>

<body>
    <div id="wrap">
        <div class="header"> <!--헤더-->
            <div class="left-head"> 
                <img src="로고이미지없음" />
            <div class="right-head">
                <ul class="top-menu">
                    <li> 스튜디오 소개 </li>
                    <li> 스튜디오 예약 </li>
                    <li> 블로그 </li>
                    <li> 포토갤러리 </li>
                    <li> 오시는 길 </li>
                </ul>
        </div> <!-- 헤더 end -->

        <div class="main"> <!-- 메인 -->
            <div class="main-image"> <img src="./main.jpg" />
            </div>
            <div class="main-text">
                <div class="upper">
                    <ul>
                        <img src="./icon1.png" />
                        <div><h4 class="sub-title"> 예약안내</h4> </div>
                        <div> 스튜디오 대여는 사전에 인터넷 예약을
                              하셔야 합니다. 예약은 1월 이전까지 가능합니다.
                        </div>
                    </ul>
                    <ul>
                        <img src="./icon2.png" />
                        <div><h4 class="sub-title"> 포토갤러리 </h4></div>
                        <div>취업 사진, 가족 사진, 프로필 사진. 우정 사진 등
                         개인 또는 단체가 이용할 수 있습니다.
                        </div>
                    </ul>
                </div><!-- upper 종료-->
                <div class="lower">
                    <div class="product-list">
                    <ul class="product"> <!--제품 1개-->
                        <li> <img src="./image1.jpg" /> </li>
                        <li> <h4> 촬영 스튜디오 </h4> </li>
                        <li> 카메라, 조명 등 촬영 장비 완비</li>
                    </ul>
                    
                </div> <!--lower 종료-->
            </div><!-- main-text 종료-->
        </div> <!-- main 종료 -->


        <div class="footer">
        </div> <!-- footer 종료-->
    </div> <!-- wrap 종료 -->
</body>

</html>
