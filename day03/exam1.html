<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    
    <form> <!-- 입력상자들을 감싼 폼 양식 : 추후에 백엔드(통신)--> 
        텍스트 : <input type="text" autofocus maxlength="10" placeholder="입력 전 가이드라인" /> <br /> <!--disabled는 사용 금지/ maxlength는 글자수 제한-->
        비밀번호 : <input type="password" /> <br />
        텍스트2 : <input type="text" value="유재석님" readonly/> <br /> <!-- readonly는 수정 불가-->
        첨부파일 : <input type="file" /> <br />
        첨부파일(복수) : <input type="file" multiple /> <br />
        숫자 : <input type="number" /> <br /> <!--숫자는 가독성 낮아서 사용 적음. 별도의 div 제작을 더 자주 이용-->
        날짜 : <input type="date" />
        날짜/시간 : <input type="datetime-local" /> <br />
        시간 : <input type="month" /> 
        월 : <input type="month" /> 주 : <input type="week" /> <br />
        스크롤 : <input type="range" /> <br />

        체크박스(복수) : 뉴스 <input type="checkbox" /> 광고 <input type="checkbox" />
        체크박스(단일) : 뉴스 <input type="radio" name = "가입경로"/>
                        광고 <input type="radio" name="가입경로" /> <div></div>

        폼전송 : <input type="submit" value="로그인" /> <!--빈도 줄어듦. 스크립트나 ajax 이용.-->
        폼초기화 : <input type="reset" value="다시쓰기" /> <br />
        일반버튼 : <button type="button"> 회원가입 </button> <!--빈도 높음. onclick+자바스크립트 실행--> <div></div>

        긴텍스트: <textarea cols="50" rows="5"></textarea> <br />
        목록상자 <select>
                            <option> 네이버 </option>
                            <option> 카카오 </option>
                            <option> 야후 </option>
        </select>


    </form>
</body>
</html>
